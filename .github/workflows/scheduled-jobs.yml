# Phase 10 Part 0.3 — the recommended external trigger for the scheduled
# jobs that used to run on Vercel Cron before this project's plan stopped
# supporting the schedule it had (docs/admin/CRON_INCIDENT.md). Free,
# needs no plan upgrade, and is not tied to Vercel in any way — any
# scheduler that can make one authenticated HTTPS request on a timer would
# do the same job.
#
# Setup: add two repository secrets in GitHub (Settings > Secrets and
# variables > Actions):
#   DEPLOYMENT_URL  — e.g. https://your-app.vercel.app
#   CRON_SECRET     — must match the CRON_SECRET env var set in Vercel
#
# This calls the single run-due endpoint (lib/platform/scheduler/), which
# runs whichever of the 12 registered jobs are currently due — it does not
# need to know the individual schedules itself, only how often to check.
# Every 15 minutes covers the shortest real interval among the 12 jobs
# (platform-access-session-expiry).

name: Aupulens scheduled jobs

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  run-due:
    runs-on: ubuntu-latest
    steps:
      - name: Call the scheduler's run-due endpoint
        env:
          DEPLOYMENT_URL: ${{ secrets.DEPLOYMENT_URL || vars.DEPLOYMENT_URL || 'https://aupulens.online' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning title=Scheduler not triggered::GitHub Actions secret CRON_SECRET is not configured. Add it with the same value as the production CRON_SECRET."
            exit 0
          fi

          DEPLOYMENT_URL="${DEPLOYMENT_URL%/}"
          URL="$DEPLOYMENT_URL/api/platform/scheduler/run-due"
          BODY_FILE="$RUNNER_TEMP/scheduler-run-due-response.json"

          for attempt in 1 2 3; do
            HTTP_STATUS="000"
            CURL_EXIT=0
            HTTP_STATUS=$(curl -sS -o "$BODY_FILE" -w "%{http_code}" -m 30 --retry 2 --retry-delay 5 --retry-all-errors -X POST \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$URL") || CURL_EXIT=$?

            if [ "$CURL_EXIT" = "0" ] && [ "$HTTP_STATUS" = "200" ]; then
              echo "Scheduler triggered successfully. Background jobs are processing."
              cat "$BODY_FILE"
              exit 0
            fi

            echo "::warning title=Scheduler trigger attempt $attempt failed::curl_exit=$CURL_EXIT http_status=$HTTP_STATUS url=$URL"
            if [ -s "$BODY_FILE" ]; then
              cat "$BODY_FILE"
            fi
            sleep 5
          done

          echo "::warning title=Scheduler trigger skipped::The external timer could not reach run-due after retries. The app's platform scheduler records real job failures internally, and this workflow stays non-failing to avoid repeated email noise."
          exit 0
